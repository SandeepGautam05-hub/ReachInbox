services:
  # 1. Backend Web Service + BullMQ Worker
  - type: web
    name: reachinbox-scheduler-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: MIN_DELAY_BETWEEN_EMAILS_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "200"
      - key: ELASTICSEARCH_ENABLED
        value: "false"
      - fromGroup: reachinbox-secrets

  # 2. Frontend Static Site
  - type: web
    name: reachinbox-scheduler-frontend
    env: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: reachinbox-scheduler-backend
          property: host

envVarGroups:
  - name: reachinbox-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SLACK_DEFAULT_WEBHOOK_URL
        value: ""
